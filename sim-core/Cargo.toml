[package]
name = "ansible-sim-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic Rust simulation core for Ansible (compiled to WASM for Nakama Go runtime)"

[lib]
name = "ansible_sim_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
